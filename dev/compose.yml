name: crafty-provider-dev

services:
  crafty:
    image: ${CRAFTY_IMAGE:-registry.gitlab.com/crafty-controller/crafty-4:4.10.4}
    environment:
      TZ: Europe/Warsaw
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:25565:25565"
    volumes:
      - config:/crafty/app/config
      - servers:/crafty/servers
      - backups:/crafty/backups
      - logs:/crafty/logs
      - imports:/crafty/import
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, ssl, urllib.request; r = urllib.request.urlopen('https://127.0.0.1:8443/api/v2/crafty/check', context=ssl._create_unverified_context(), timeout=5); assert json.load(r)['status'] == 'ok'"
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 12
    stop_grace_period: 60s

  api:
    image: nginx:1.28-alpine
    depends_on:
      crafty:
        condition: service_healthy
    ports:
      - "127.0.0.1:18000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v2/crafty/check"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  config:
  servers:
  backups:
  logs:
  imports:
