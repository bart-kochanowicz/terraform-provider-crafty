name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Check Go formatting
        run: golangci-lint fmt --diff --diff-colored=false

  checks:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Validate Docker Compose configuration
        run: make dev-check
      - name: Check formatting
        run: make fmt-check
      - name: Test and build
        run: make test vet build
      - name: Validate Terraform examples with the local provider
        shell: bash
        run: |
          config="$RUNNER_TEMP/crafty.tfrc"
          cat > "$config" <<EOF_CONFIG
          provider_installation {
            dev_overrides {
              "registry.terraform.io/bart-kochanowicz/crafty" = "$GITHUB_WORKSPACE/bin"
            }
            direct {}
          }
          EOF_CONFIG
          TF_CLI_CONFIG_FILE="$config" terraform -chdir=examples/local validate
          TF_CLI_CONFIG_FILE="$config" terraform -chdir=examples/docker validate
