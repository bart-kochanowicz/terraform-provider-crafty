name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Check Go formatting
        run: golangci-lint fmt --diff --diff-colored=false

  checks:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Verify dependencies and generated documentation
        run: make deps-check docs-check release-version-check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: check
      - name: Run shared local and CI checks
        run: make check-core

  compatibility:
    name: Terraform compatibility (${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        terraform: ['1.5.0', '1.16.4']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Validate examples and verify Terraform state behavior
        run: make validate-examples test-acc-mock

  snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --snapshot --clean --skip=sign
      - name: Verify packages and native Terraform installation
        run: make release-verify
      - name: Create disposable snapshot signing key
        id: snapshot-key
        shell: bash
        run: |
          signing_home=$(mktemp -d)
          chmod 700 "$signing_home"
          export GNUPGHOME="$signing_home"
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'Crafty CI test <test@example.invalid>' rsa2048 sign 0
          fingerprint=$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')
          echo "home=$signing_home" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Build signed snapshot with disposable key
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --snapshot --clean
        env:
          GNUPGHOME: ${{ steps.snapshot-key.outputs.home }}
          GPG_FINGERPRINT: ${{ steps.snapshot-key.outputs.fingerprint }}
      - name: Verify disposable signature and native installation
        env:
          GNUPGHOME: ${{ steps.snapshot-key.outputs.home }}
          GPG_FINGERPRINT: ${{ steps.snapshot-key.outputs.fingerprint }}
        run: python3 dev/verify_release.py --source-manifest terraform-registry-manifest.json --require-signature --signing-fingerprint "$GPG_FINGERPRINT"

  integration_baselines:
    name: Crafty integration (${{ matrix.crafty }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crafty: ['4.10.4', '4.11.0']
    env:
      COMPOSE_PROJECT_NAME: crafty-provider-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      CRAFTY_IMAGE: registry.gitlab.com/crafty-controller/crafty-4:${{ matrix.crafty }}
      CRAFTY_TEST_BASELINE: ${{ matrix.crafty }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Start Crafty and wait for readiness
        timeout-minutes: 15
        run: python3 dev/ci.py up
      - name: Bootstrap credentials, verify API contract, and run acceptance tests
        timeout-minutes: 25
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          python3 dev/ci.py test
      - name: Upload API contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafty-api-contract-${{ matrix.crafty }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/ci-logs/api-contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Collect failure diagnostics
        if: failure()
        run: python3 dev/ci.py logs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crafty-integration-${{ matrix.crafty }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/ci-logs
          retention-days: 7
          if-no-files-found: warn
      - name: Remove containers and volumes
        if: always()
        run: python3 dev/ci.py down

  integration:
    name: Crafty acceptance tests
    needs: integration_baselines
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Crafty baseline to pass
        env:
          BASELINES_RESULT: ${{ needs.integration_baselines.result }}
        run: test "$BASELINES_RESULT" = success
