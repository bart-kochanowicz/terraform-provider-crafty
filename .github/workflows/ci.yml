name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Check Go formatting
        run: golangci-lint fmt --diff --diff-colored=false

  checks:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check generated documentation
        run: make docs-check
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: check
      - name: Validate Docker Compose configuration
        run: |
          make dev-check
          COMPOSE_PROJECT_NAME=crafty-provider-ci-validation docker compose -f dev/compose.yml -f dev/compose.ci.yml config --quiet
      - name: Test CI isolation and credential handling
        run: python3 -m unittest discover -s dev -p 'test_*.py'
      - name: Check formatting
        run: make fmt-check
      - name: Test and build
        run: make test vet build
      - name: Validate Terraform examples with the local provider
        shell: bash
        run: |
          config="$RUNNER_TEMP/crafty.tfrc"
          cat > "$config" <<EOF_CONFIG
          provider_installation {
            dev_overrides {
              "registry.terraform.io/bart-kochanowicz/crafty" = "$GITHUB_WORKSPACE/bin"
            }
            direct {}
          }
          EOF_CONFIG
          TF_CLI_CONFIG_FILE="$config" terraform -chdir=examples/local validate
          TF_CLI_CONFIG_FILE="$config" terraform -chdir=examples/docker validate

  integration:
    name: Crafty acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: crafty-provider-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Start Crafty and wait for readiness
        timeout-minutes: 15
        run: python3 dev/ci.py up
      - name: Bootstrap credentials, verify API contract, and run acceptance tests
        timeout-minutes: 25
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          python3 dev/ci.py test
      - name: Upload API contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafty-api-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/ci-logs/api-contract.json
          retention-days: 7
          if-no-files-found: error
      - name: Collect failure diagnostics
        if: failure()
        run: python3 dev/ci.py logs
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crafty-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: bin/ci-logs
          retention-days: 7
          if-no-files-found: warn
      - name: Remove containers and volumes
        if: always()
        run: python3 dev/ci.py down
