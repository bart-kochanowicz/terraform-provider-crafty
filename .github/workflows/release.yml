name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag matching the committed version (for example v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v0.1.0" >&2
            exit 1
          fi
      - name: Require green main CI for manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Manual releases must run from main." >&2
            exit 1
          fi
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=1" --jq '.workflow_runs[0].conclusion')
          if [[ "$conclusion" != success ]]; then
            echo "The selected main commit must have a successful push CI run before publication." >&2
            exit 1
          fi
      - name: Reject an already published version
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == false) | .tag_name")
          if [[ -n "$published" ]]; then
            echo "This version is already public. Prepare a new version instead of replacing it." >&2
            exit 1
          fi
      - name: Require a maintainer-selected license
        run: |
          if [ ! -s LICENSE ]; then
            echo "Select and commit LICENSE before publishing the initial release." >&2
            exit 1
          fi
      - name: Check release version and prepare release notes
        run: python3 dev/release_version.py --tag "$RELEASE_TAG" --notes-output "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Verify dependencies, tests, and documentation
        run: |
          go mod download
          go mod verify
          make test vet docs-check
      - name: Verify release packages before publication
        run: make release-snapshot
      - name: Import release signing key
        id: signing
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Create or verify the selected release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "Existing tag points to a different commit; tags must never be moved." >&2
              exit 1
            fi
          else
            tag_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$RELEASE_TAG" -f message="Release $RELEASE_TAG" \
              -f object="$GITHUB_SHA" -f type=commit --jq .sha)
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_sha"
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          # GoReleaser must observe the same tag as the legacy tag-push path.
          git checkout --detach "$RELEASE_TAG"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
      - name: Verify signed release before making it public
        env:
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: python3 dev/verify_release.py --source-manifest terraform-registry-manifest.json --require-signature --signing-fingerprint "$GPG_FINGERPRINT"
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
