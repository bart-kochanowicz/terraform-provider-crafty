name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as v0.1.0" >&2
            exit 1
          fi
      - name: Require a maintainer-selected license
        run: |
          if [ ! -s LICENSE ]; then
            echo "Select and commit LICENSE before publishing the initial release." >&2
            exit 1
          fi
      - name: Check release version and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 dev/release_version.py --tag "$RELEASE_TAG" --notes-output "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Verify dependencies, tests, and documentation
        run: |
          go mod download
          go mod verify
          make test vet docs-check
      - name: Verify release packages before publication
        run: make release-snapshot
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
